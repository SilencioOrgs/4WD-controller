name: Verify Next.js controller
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Protocol tests
        run: npm run test
      - name: TypeScript and Next.js static export
        run: npm run build
      - name: Generate Capacitor Android project
        run: npm run cap:add:android
      - name: Check native Android permissions and orientation
        run: |
          grep -q 'screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
