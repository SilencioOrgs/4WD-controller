name: Verify Next.js controller
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Protocol tests
        run: npm run test
      - name: TypeScript
        run: npm run typecheck
      - name: Next.js static export
        run: npm run build
      - name: Generate Capacitor Android project
        run: npm run cap:add:android
      - name: Check native Android permissions and orientation
        run: |
          grep -q 'screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core 3.x and firmware libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "WebSockets" "ArduinoJson"
      - name: Compile AI Thinker ESP32-CAM firmware
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32cam firmware/ESP32_CAM_4WD_Controller
